name: Release CI
on:
  push:
    branches:
      - main
permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
      - uses: actions/setup-java@v5
        name: Setup Gradle JVM
        with:
          distribution: 'temurin'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew nativeCompile
        env:
          GRADLE_OPTS: -Djava.io.tmpdir=${{ runner.temp }}
      - uses: actions/upload-artifact@v5
        with:
          name: native-image-${{ matrix.os }}
          path: build/native/nativeCompile/*
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: native-image-windows-latest
          path: windows-amd64
      - uses: actions/download-artifact@v5
        with:
          name: native-image-macos-latest
          path: macos
      - uses: actions/download-artifact@v5
        with:
          name: native-image-linux-latest
          path: linux-amd64
      - uses: actions/download-artifact@v5
        with:
          name: native-image-ubuntu-24.04-arm
          path: linux-arm64
      - name: Rename files
        run: |
          mkdir release_files
          mv windows-amd64/role-assigner.exe release_files/role-assigner-windows-amd64.exe
          mv linux-amd64/role-assigner release_files/role-assigner-linux-amd64
          mv linux-arm64/role-assigner release_files/role-assigner-linux-arm64
          mv macos/role-assigner release_files/role-assigner-macos-arm64
      - name: Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: release_files/*
          tag_name: ${{ github.run_number }}
